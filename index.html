<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8f4"><title>말씀의 사람들 | 함께하는 성경 연구</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><a href="#/people" class="brand"><span class="brand-icon">✦</span><span>말씀의 사람들<small>함께하는 성경 연구</small></span></a><nav aria-label="연구 분야"><a href="#/people" data-nav="people">인물별</a><a href="#/books" data-nav="books">성경 책별</a><a href="#/topics" data-nav="topics">주제별</a><a href="#/verses" data-nav="verses">성구별</a></nav></header>
<main><div id="app" aria-live="polite"><p class="loading">연구 기록을 불러오는 중입니다…</p></div></main><footer><span>말씀의 사람들 · 천천히 읽고, 오래 묵상하기</span><div><button class="link" id="backup">백업 내려받기</button><button class="link" id="restore">백업 가져오기</button><button class="link" id="move-images">기존 이미지 옮기기</button><input id="restore-file" type="file" accept="application/json,.json" hidden></div></footer>
<dialog id="edit-dialog"><div class="dialog-inner"><div class="dialog-top"><span class="eyebrow">STUDY NOTE</span><button type="button" class="icon-button" data-close aria-label="닫기">×</button></div><h2 id="form-heading">새 연구 기록</h2><p class="muted">글과 이미지는 누구나 볼 수 있습니다.</p><form id="note-form"><label>작성자<select id="author"><option value="mine">민수</option><option value="bora">보라</option></select></label><label>제목<input id="note-title" maxlength="100" required placeholder="기록의 제목"></label><label>묵상 내용<textarea id="note-body" required maxlength="20000" rows="7" placeholder="기억하고 싶은 내용을 적어 보세요."></textarea></label><details class="additional"><summary>성구 · 주제 · 자료 링크 추가 <span>선택 사항</span></summary><div class="extra-fields"><label>성경 책<input id="note-book" maxlength="100" placeholder="예: 시편"></label><label>관련 성구<input id="note-verse" maxlength="300" placeholder="예: 시편 23:1"></label><label>주제<input id="note-topic" maxlength="300" placeholder="예: 믿음, 기도 (쉼표로 구분)"></label><label>자료 링크<input id="note-url" type="url" maxlength="2000" placeholder="https://www.jw.org/…"></label></div></details><label>이미지 <small class="muted">최대 3장, 원본 한 장당 5MB 이하</small><input id="note-images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple></label><p id="image-help" class="small muted"></p><label>작성 비밀번호<input id="note-password" type="password" required autocomplete="current-password" placeholder="작성 비밀번호"></label><p id="form-message" class="small" role="status"></p><button class="primary" type="submit">기록 저장</button></form></div></dialog>
<dialog id="person-dialog"><div class="dialog-inner"><div class="dialog-top"><span class="eyebrow">ADD PERSON</span><button type="button" class="icon-button" data-close aria-label="닫기">×</button></div><h2>인물 추가</h2><p class="muted">기존 인물과 구분할 수 있는 이름을 입력해 주세요. 추가한 인물은 선택한 시대의 끝에 표시됩니다.</p><form id="person-form"><label>이름<input id="new-name" maxlength="100" required placeholder="인물 이름"></label><label>시대<select id="new-era"></select></label><label>JW.ORG 검색어 <small class="muted">선택 사항</small><input id="new-search" maxlength="200" placeholder="이름과 다르게 검색할 때만 입력"></label><label>작성 비밀번호<input id="person-password" type="password" autocomplete="current-password" required></label><p id="person-message" class="small" role="status"></p><button class="primary">인물 추가</button></form></div></dialog>
<dialog id="image-dialog"><div class="image-view"><button type="button" class="icon-button" data-close aria-label="닫기">×</button><img id="full-image" alt="첨부 이미지 원본"></div></dialog><script src="app.js"></script></body></html>
