<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f2">
  <title>사진 선택 확인</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#293d31;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}main{max-width:520px;margin:auto;padding:32px 24px 48px}h1{font-size:23px;margin:0 0 12px}p{font-size:15px;line-height:1.7;color:#607367;margin:0 0 24px}.choices{border-top:1px solid #d9e2d8}.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid #d9e2d8}.row button{font:inherit;color:#31583d;background:#e6eee6;border:0;border-radius:12px;padding:12px 16px;min-height:48px;cursor:pointer;font-weight:650}.row button:disabled{opacity:.5;cursor:default}.row output{font-size:14px;text-align:right;color:#627568}.row output.success{color:#315f3b;font-weight:700}input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.foot{margin-top:24px;font-size:13px}
  </style>
</head>
<body>
<main>
  <h1>사진 선택 확인</h1>
  <p>각 버튼을 눌러 사진 두 장을 선택해 주세요. 사진은 전송하거나 저장하지 않습니다.</p>
  <div class="choices">
    <div class="row"><button type="button" data-test="a">방법 1</button><output id="result-a" aria-live="polite">아직 확인하지 않음</output><input type="file" id="file-a" accept="image/*" multiple tabindex="-1"></div>
    <div class="row"><button type="button" data-test="b">방법 2</button><output id="result-b" aria-live="polite">아직 확인하지 않음</output><input type="file" id="file-b" accept="image/*,.jpg,.jpeg,.png,.webp,.gif" multiple tabindex="-1"></div>
    <div class="row"><button type="button" data-test="c">방법 3</button><output id="result-c" aria-live="polite">아직 확인하지 않음</output><input type="file" id="file-c" multiple tabindex="-1"></div>
    <div class="row"><button type="button" data-test="d">방법 4</button><output id="result-d" aria-live="polite">아직 확인하지 않음</output></div>
  </div>
  <p class="foot">한 장만 선택된다면 그 사진을 선택해 결과를 남겨 주세요. 확인 후 이 화면을 캡처해 보내주세요.</p>
</main>
<script>
  function result(id,message,success=false){const output=document.getElementById('result-'+id);output.textContent=message;output.classList.toggle('success',success)}
  for(const id of ['a','b','c']){
    const input=document.getElementById('file-'+id);
    input.addEventListener('change',()=>{const count=input.files.length;result(id,count+'장 선택됨',count>1);input.value=''});
    input.addEventListener('cancel',()=>result(id,'선택 취소됨'));
    document.querySelector('[data-test="'+id+'"]').addEventListener('click',()=>input.click());
  }
  const alternate=document.querySelector('[data-test="d"]');
  if(typeof window.showOpenFilePicker!=='function'){alternate.disabled=true;result('d','이 기기에서 지원하지 않음')}
  else alternate.addEventListener('click',async()=>{try{const files=await window.showOpenFilePicker({multiple:true,types:[{description:'사진',accept:{'image/jpeg':['.jpg','.jpeg'],'image/png':['.png'],'image/webp':['.webp'],'image/gif':['.gif']}}]});result('d',files.length+'장 선택됨',files.length>1)}catch(error){result('d',error?.name==='AbortError'?'선택 취소됨':'선택창을 열지 못함')}});
</script>
</body>
</html>
